name: Golden Path E2E

# Single workflow that proves the entire chain works end-to-end:
#
#   scaffold → install → unit-tests → docker build → push to local registry
#     → cosign sign by digest → Kyverno admit → kustomize patch with @sha256
#     → kubectl apply to kind → smoke test in correct namespace via FQDN
#     → audit entry recorded
#
# This is the cumulative validation of the v1.10.0 audit closure
# (commits 9d8894e..adf4eb6) and the entry point for PR-A5 of the
# productization roadmap (ADR-015).
#
# Why opt-in (workflow_dispatch + weekly schedule), not per-PR:
#   Full run takes ~12-15 minutes (kind boot + Kyverno install + cosign
#   keyless + manifest validation). Per-PR validation stays on
#   validate-templates.yml::scaffold-e2e (which is a faster strict
#   subset). This workflow is the trust anchor: when it goes green
#   the template's promises hold.
#
# Failure modes this catches that nothing else does:
#   - Overlay name typo                                  (kustomize build fails)
#   - Image pushed but digest pin step missing           (Kyverno rejects)
#   - Cosign signs by tag, Kyverno wants digest          (admission fails)
#   - Smoke test uses wrong namespace                    (curl fails to resolve)
#   - PSS namespace label missing on overlay             (admission rejects pod)
#   - audit_record.py imports joblib transitively        (audit step crashes)

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 03:00 UTC — independent from per-PR cadence so a
    # template-side regression that creeps in on Friday doesn't block
    # Monday morning PRs but DOES surface in the next scheduled run.
    - cron: "0 3 * * 1"

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC + Sigstore Fulcio
  packages: read

env:
  # Single source of truth for service names used across this workflow.
  # Copier renders these via {@ service_slug @} tokens in the template.
  #
  # SERVICE_SLUG intentionally stays single-word here to keep the
  # workflow output readable. Snake-to-kebab rendering is covered by
  # scripts/test_scaffold.sh and test_k8s_name_vocabulary.py.
  SERVICE_NAME: GoldenPath
  SERVICE_SLUG: goldenpath
  KIND_VERSION: v0.24.0
  KIND_IMAGE: kindest/node:v1.30.0
  # Kyverno chart version (NOT app version). Chart 3.x maps to app 1.x;
  # use the latest chart available rather than pinning to keep the
  # admission gate's policy syntax current. If a regression on the
  # template's policies appears we can pin chart 3.3.x here.
  KYVERNO_CHART_VERSION: ""
  COSIGN_VERSION: v2.4.0

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. SCAFFOLD — produce a real service tree from the template
  # ─────────────────────────────────────────────────────────────────
  scaffold:
    name: Scaffold service from template
    runs-on: ubuntu-latest
    outputs:
      service_dir: ${{ steps.run.outputs.service_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Copier
        run: pip install "copier>=9.0.0" jsonschema

      - name: Scaffold service via Copier
        id: run
        # new-service.sh is a thin wrapper around `copier copy`.
        # It always writes to $REPO_ROOT/$SERVICE_NAME (relative to the
        # script's parent directory — i.e. $GITHUB_WORKSPACE in CI).
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/templates/scripts/new-service.sh" \
            "${{ env.SERVICE_NAME }}" "${{ env.SERVICE_SLUG }}"
          ls -la "$GITHUB_WORKSPACE/${{ env.SERVICE_NAME }}/" | head -20
          echo "service_dir=${{ env.SERVICE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Validate the scaffolder produced every overlay
        # If this step ever fails, audit Critical-1 has regressed.
        #
        # Compared against the template rather than a literal list: the list
        # said six and the template ships seven, so `batch-only` could have
        # gone missing from a scaffold without this noticing. Comparing the
        # two trees also catches an overlay that is ADDED to the template but
        # never rendered, which a list cannot.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -t EXPECTED < <(cd templates/service/k8s/overlays && ls -d */ | sed 's|/$||')
          if [ ${#EXPECTED[@]} -eq 0 ]; then
            echo "::error::no overlays in the template — nothing to compare against"; exit 1
          fi
          cd "$GITHUB_WORKSPACE/${{ env.SERVICE_NAME }}"
          for o in "${EXPECTED[@]}"; do
            test -d "k8s/overlays/$o" || { echo "::error::missing overlay $o"; exit 1; }
            test -f "k8s/overlays/$o/namespace.yaml" || { echo "::error::missing namespace.yaml in $o"; exit 1; }
          done
          mapfile -t ACTUAL < <(cd k8s/overlays && ls -d */ | sed 's|/$||')
          if [ "${#ACTUAL[@]}" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::scaffold has ${#ACTUAL[@]} overlays, template has ${#EXPECTED[@]}: ${ACTUAL[*]} vs ${EXPECTED[*]}"
            exit 1
          fi
          echo "✓ All ${#EXPECTED[@]} overlays + namespace.yaml present: ${EXPECTED[*]}"

      - name: Patch dev overlay for synthetic CI model
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/${{ env.SERVICE_NAME }}/k8s/overlays/gcp-dev"
          cat <<'EOF' >> kustomization.yaml

            # Golden Path CI only: remove cloud model download and allow
            # the app's guarded synthetic model fallback. Production
            # overlays keep the real init container and MODEL_PATH contract.
            - target:
                kind: Deployment
                name: goldenpath-predictor
              patch: |-
                - op: remove
                  path: /spec/template/spec/initContainers
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: ALLOW_MODELLESS_STARTUP
                    value: "true"
          EOF

          # ENVIRONMENT is deliberately NOT patched here. The gcp-dev overlay
          # already sets it, and this used to `add` a second entry to the same
          # env list: Kubernetes keeps the last one, but `kubectl apply` emits
          #   containers[0].env[9]: hides previous definition of "ENVIRONMENT"
          # on stderr — and the apply-result check below treated any stderr
          # residue as a failure. That warning is one of the two reasons this
          # job had been red every week since 2026-05-11.

      - name: Upload scaffolded service for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scaffolded-service
          path: ${{ env.SERVICE_NAME }}/
          include-hidden-files: true
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # 2. BUILD + PUSH + SIGN by digest
  # ─────────────────────────────────────────────────────────────────
  # We use a kind-local registry so cosign can sign immutable digests
  # AND the kind cluster (in the next job) can pull the same image
  # without ghcr/ECR/GAR setup. Local registry is throwaway per run.
  build-and-sign:
    name: Build, push, sign by digest
    needs: scaffold
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.value }}
      registry: ${{ steps.reg.outputs.host_port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download scaffolded service
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scaffolded-service
          path: ${{ env.SERVICE_NAME }}/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Start local Docker registry
        id: reg
        run: |
          # Local registry on host network; kind will treat it as
          # localhost:5001 from inside the cluster (configured in next job).
          docker run -d --name kind-registry -p 5001:5000 registry:2
          # Wait for registry readiness
          for i in {1..30}; do
            curl -sf http://localhost:5001/v2/ && break || sleep 1
          done
          echo "host_port=localhost:5001" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          set -euo pipefail
          cd "${{ env.SERVICE_NAME }}"
          docker build -t localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test .
          docker push   localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test

      # The generated service's own ci.yml scans its image with Trivy and fails
      # on CRITICAL,HIGH. The golden path built an image and never scanned it,
      # so the one lane that actually produces a runnable artefact applied a
      # weaker bar than the lane it is supposed to be the trust anchor for.
      #
      # It runs here, before signing: an image that would fail the adopter's own
      # gate must not be signed, attested and admitted by this workflow — that
      # would put a Cosign signature on something the template tells adopters to
      # reject.
      #
      # The runtime/training split (ADR-049) is what makes this affordable to
      # switch on: the served image carried 24 fixable CRITICAL/HIGH advisories
      # before it and 4 after, none of them CRITICAL. The four that remain
      # (starlette x3, pyarrow) are accepted with dates in
      # .security-baselines/trivy-fs.trivyignore, and check_baselines_expiry.py
      # fails the build when those dates pass.
      - name: Trivy image scan (the gate the generated service ships)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .security-baselines/trivy-fs.trivyignore
          format: table

      - name: Capture image digest
        id: digest
        # Mirrors the canonical step in templates/service/.github/workflows/deploy-{gcp,aws}.yml.
        # Without this, the rest of the chain (cosign sign by digest,
        # Kyverno admit by digest, kustomize edit set image @sha256)
        # has nothing to bind to.
        run: |
          set -euo pipefail
          IMG="localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test"
          DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{ .Manifest.Digest }}')
          test -n "$DIGEST" && [[ "$DIGEST" == sha256:* ]] || {
            echo "::error::digest capture returned: '$DIGEST'"
            exit 1
          }
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "✓ digest = $DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image by digest (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          REPO="localhost:5001/${{ env.SERVICE_SLUG }}-predictor"
          DIGEST="${{ steps.digest.outputs.value }}"
          # Keyless: GitHub OIDC token → Fulcio → ephemeral cert →
          # Sigstore transparency log (Rekor).
          cosign sign --yes "${REPO}@${DIGEST}"
          echo "✓ Signed ${REPO}@${DIGEST}"

      - name: Verify signature reachable
        # Same verification Kyverno does inside the cluster, but here
        # the GitHub Action uses public Sigstore. If THIS fails, the
        # admission gate in the next job will too.
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          REPO="localhost:5001/${{ env.SERVICE_SLUG }}-predictor"
          DIGEST="${{ steps.digest.outputs.value }}"
          cosign verify "${REPO}@${DIGEST}" \
            --certificate-identity-regexp "https://github\\.com/.+/\\.github/workflows/.+@.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > /tmp/cosign-verify.json
          jq '.[].critical.identity' /tmp/cosign-verify.json
          echo "✓ Signature verified end-to-end"

      - name: Save image as artifact (for next job)
        # kind nodes are containers; they can't reach localhost:5001 of
        # this runner. Easier to save the image and load it into the
        # kind cluster directly than to network-bridge the registry.
        run: |
          docker save \
            "localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test" \
            -o /tmp/image.tar

      - name: Upload image tar + digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: built-image
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # 3. ADMIT — kind + Kyverno + apply overlay (digest-pinned)
  # ─────────────────────────────────────────────────────────────────
  admit-and-smoke:
    name: kind + Kyverno admit + smoke test
    needs: [scaffold, build-and-sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download scaffolded service
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scaffolded-service
          path: ${{ env.SERVICE_NAME }}/

      - name: Download built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-image
          path: /tmp/

      # Canonical actions instead of `curl | bash` from GitHub raw URLs.
      # Reason (run 24953193994 failure): the kustomize install script
      # calls the GitHub releases API unauthenticated, which on shared
      # runners trips the per-IP rate limiter:
      #   "Github rate-limiter failed the request. Either authenticate
      #    or wait a couple of minutes."
      # All four installs below pin to specific releases via either
      # actions or direct tarball URLs (no API).
      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.30.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Install kustomize (direct release tarball, no GH API)
        run: |
          set -euo pipefail
          KVER=v5.4.3
          curl -sSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KVER}/kustomize_${KVER}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      # ---------------------------------------------------------------
      # The deployment references the image BY DIGEST, because D-19 and the
      # Kyverno policy below require it. `kind load docker-image` loads an
      # image under its TAG, and containerd cannot resolve a digest from a
      # tag-loaded image — so it tried to pull `…@sha256:…` from a registry
      # the kind nodes could not reach, and every pod sat in ErrImagePull.
      # That is the third and last reason this job was red for eighteen
      # weeks; the two before it were hiding this one.
      #
      # So the nodes get a registry they can actually reach. The registry in
      # the build job lives on a different runner and is gone by now, but the
      # image tar is not: re-pushing identical content reproduces the same
      # manifest digest, which the step below asserts rather than assumes.
      # ---------------------------------------------------------------
      - name: Start a registry the kind nodes can reach
        run: |
          set -euo pipefail
          docker run -d --name kind-registry --restart=always -p 5001:5000 registry:2
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5001/v2/ >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:5001/v2/ >/dev/null

      - name: Re-push the built image and confirm the digest is unchanged
        run: |
          set -euo pipefail
          IMG="localhost:5001/${{ env.SERVICE_SLUG }}-predictor:test"
          EXPECTED="${{ needs.build-and-sign.outputs.digest }}"
          docker load -i /tmp/image.tar
          docker push "$IMG"
          ACTUAL=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG" | cut -d@ -f2)
          echo "→ expected $EXPECTED"
          echo "→ actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::re-pushed digest does not match the one the overlay pins."
            echo "::error::The deployment would reference an image this registry does not have,"
            echo "::error::which is the ErrImagePull this step exists to prevent."
            exit 1
          fi

      - name: Write the kind config that mirrors that registry
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
                endpoint = ["http://kind-registry:5000"]
          EOF
          cat /tmp/kind-config.yaml

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: golden-path
          node_image: ${{ env.KIND_IMAGE }}
          config: /tmp/kind-config.yaml
          wait: 120s

      - name: Put the registry on the cluster network
        # Without this the mirror endpoint `kind-registry:5000` does not
        # resolve from inside the nodes.
        run: |
          set -euo pipefail
          docker network connect kind kind-registry
          docker network inspect kind --format '{{range .Containers}}{{.Name}} {{end}}'

      - name: Install Kyverno
        run: |
          set -euo pipefail
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          # Don't pin chart version: chart numbering (3.x) is independent
          # from Kyverno app version (1.x), and the test must work with
          # whatever the current chart is. See run 24953286815 failure:
          #   chart "kyverno" matching v1.13.0 not found in kyverno index
          helm install kyverno kyverno/kyverno \
            -n kyverno --create-namespace \
            --wait --timeout 5m
          # The chart's pod label is app.kubernetes.io/part-of=kyverno;
          # use that to wait for ALL kyverno components ready, not just
          # one instance.
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=kyverno \
            -n kyverno --timeout=180s

      - name: Apply digest-enforcement ClusterPolicy
        run: |
          set -euo pipefail
          cat <<'EOF' > /tmp/golden-path-digest-policy.yaml
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: require-image-digest
            annotations:
              policies.kyverno.io/title: Require image digest (golden-path test)
              policies.kyverno.io/severity: high
              policies.kyverno.io/description: |
                Enforces audit invariant D-19 "no image may be admitted
                without a @sha256:... digest". This is the minimum
                contract the v1.10.0 audit closed. Signature trust is
                validated in production deploys by the separate
                kyverno-image-verification.yaml policy which requires
                refs/heads/main identity.
          spec:
            validationFailureAction: Enforce
            background: false
            rules:
              - name: require-digest
                match:
                  any:
                    - resources:
                        kinds:
                          - Pod
                        namespaces:
                          - "${{ env.SERVICE_SLUG }}-dev"
                validate:
                  message: >-
                    Image must be pinned by @sha256:... digest.
                    Tag-only references are not allowed (D-19).
                  pattern:
                    spec:
                      containers:
                        - image: "*@sha256:*"
          EOF
          kubectl apply -f /tmp/golden-path-digest-policy.yaml
          kubectl get cpol
          # Wait for the policy webhook to be ready (Kyverno registers
          # admission webhooks asynchronously after policy creation).
          sleep 5

      - name: Patch overlay to use the digest we just signed
        # Same logic as deploy-common.yml's "Pin image to digest" step,
        # condensed for the golden-path test.
        run: |
          set -euo pipefail
          OVERLAY="${{ env.SERVICE_NAME }}/k8s/overlays/gcp-dev"
          DIGEST="${{ needs.build-and-sign.outputs.digest }}"
          IMG_NAME="${{ env.SERVICE_SLUG }}-predictor"
          NEW_NAME="localhost:5001/${{ env.SERVICE_SLUG }}-predictor"
          cd "$OVERLAY"
          # Replace the placeholder newName + tag with the local registry
          # path AND attach the digest. Equivalent to deploy-common.yml.
          kustomize edit set image "${IMG_NAME}=${NEW_NAME}@${DIGEST}"
          echo "→ Final image refs in overlay:"
          grep -A3 '^images:' kustomization.yaml

      - name: Apply overlay (gcp-dev)
        # The overlay includes resources that depend on platform CRDs
        # not installed in this kind cluster:
        #   - AnalysisTemplate (Argo Rollouts) — for canary analysis
        #   - PrometheusRule   (Prometheus Operator) — for SLO alerts
        #
        # Real clusters provide these via platform bootstrap (out of
        # scope for golden path). The audit closure tested:
        #   1. namespace created with PSS label                 (D-29)
        #   2. predictor deployment admitted with @sha256 image (D-19)
        #   3. namespace name valid RFC 1123                    (regression)
        #
        # All three are validated by explicit kubectl assertions
        # below. The apply exit code is non-zero only because of the
        # unrelated unrecognized CRDs; we assert the deployment and
        # namespace landed regardless.
        run: |
          set +e
          OVERLAY="${{ env.SERVICE_NAME }}/k8s/overlays/gcp-dev"
          kubectl apply -k "$OVERLAY" 2> /tmp/apply.err
          APPLY_RC=$?
          set -e
          cat /tmp/apply.err
          # Decide on MEANING, not on leftover lines.
          #
          # The original check subtracted the lines it recognised and failed if
          # anything remained. Two things always remain: `kubectl` writes
          # warnings to the same stream, and each "no matches for kind" error
          # is followed by a continuation line, `ensure CRDs are installed
          # first`, which carries no kind name and therefore survived every
          # filter. That is why this job was red for eighteen consecutive
          # weeks. A line-subtraction check is fragile against a tool that is
          # free to reformat its own diagnostics.
          #
          # So: collect the KINDS that failed to map. If every one is a CRD
          # this cluster is known not to have, the apply did what it could.
          if grep -q '^Warning:' /tmp/apply.err; then
            echo "→ kubectl warnings (not fatal, but read them):"
            grep '^Warning:' /tmp/apply.err | sed 's/^/::warning::/'
          fi
          if [ "$APPLY_RC" -ne 0 ]; then
            unmatched=$(grep -oE 'no matches for kind "[^"]+"' /tmp/apply.err \
                        | sed -E 's/.*"([^"]+)"/\1/' | sort -u)
            unexpected=$(echo "$unmatched" | grep -Ev '^(AnalysisTemplate|PrometheusRule)$' || true)
            if [ -z "$unmatched" ] || [ -n "$unexpected" ]; then
              echo "::error::kubectl apply failed for reasons other than known missing CRDs"
              [ -n "$unexpected" ] && echo "::error::unexpected unmapped kind(s): $(echo "$unexpected" | tr '\n' ' ')"
              cat /tmp/apply.err
              exit "$APPLY_RC"
            fi
            echo "→ unmapped kinds, all expected in a bare kind cluster: $(echo "$unmatched" | tr '\n' ' ')"
          fi
          echo "→ kubectl apply exit code: $APPLY_RC (known missing CRDs only)"
          echo "→ Namespaces:"
          kubectl get ns | grep -E "(NAME|${{ env.SERVICE_SLUG }})"
          echo "→ Workload state:"
          kubectl get all -n ${{ env.SERVICE_SLUG }}-dev
          echo "→ Verifying the audit-closure contract:"
          # 1. Namespace exists with the expected name (no underscore bug)
          kubectl get ns "${{ env.SERVICE_SLUG }}-dev" >/dev/null
          # 2. Predictor deployment exists (admission accepted by Kyverno
          #    require-image-digest policy applied earlier)
          kubectl get deploy "${{ env.SERVICE_SLUG }}-predictor" \
            -n "${{ env.SERVICE_SLUG }}-dev" >/dev/null
          echo "✓ Audit-closure contract holds; CRD-only resources skipped"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          NAMESPACE="${{ env.SERVICE_SLUG }}-dev"
          DEPLOY="${{ env.SERVICE_SLUG }}-predictor"
          kubectl rollout status "deployment/${DEPLOY}" -n "$NAMESPACE" --timeout=180s
          echo "✓ Deployment is Available"

      - name: Smoke /health, /ready and /predict
        run: |
          set -euo pipefail
          NAMESPACE="${{ env.SERVICE_SLUG }}-dev"
          kubectl -n "$NAMESPACE" port-forward "svc/${{ env.SERVICE_SLUG }}-service" 18000:80 >/tmp/portfwd.log 2>&1 &
          echo $! > /tmp/portfwd.pid
          trap 'kill $(cat /tmp/portfwd.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:18000/health >/dev/null
          curl -fsS http://localhost:18000/ready >/dev/null
          code=$(curl -sS -o /tmp/predict.json -w '%{http_code}' \
            -X POST http://localhost:18000/predict \
            -H 'Content-Type: application/json' \
            -d '{"entity_id":"golden-path-1","slice_values":{"country":"MX"},"feature_a":42.0,"feature_b":50000.0,"feature_c":"category_A"}')
          test "$code" = "200" || {
            echo "::error::expected /predict 200, got ${code}"
            cat /tmp/predict.json
            cat /tmp/portfwd.log
            exit 1
          }
          jq -e '.prediction_id and .prediction_score and .risk_level and .model_version' /tmp/predict.json >/dev/null
          curl -fsS http://localhost:18000/metrics | grep -E '^${{ env.SERVICE_SLUG }}_(prediction_log_total|predictions_total)'
          echo "✓ Runtime smoke passed with real 2xx inference"

      - name: Verify PSS namespace label was applied
        run: |
          NAMESPACE="${{ env.SERVICE_SLUG }}-dev"
          ENFORCE=$(kubectl get ns "$NAMESPACE" \
            -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
          test "$ENFORCE" = "baseline" || {
            echo "::error::expected enforce=baseline on $NAMESPACE, got '$ENFORCE'"
            exit 1
          }
          echo "✓ Namespace $NAMESPACE has PSS enforce=$ENFORCE (D-29)"

      - name: Verify image deployed by digest, not by tag
        run: |
          NAMESPACE="${{ env.SERVICE_SLUG }}-dev"
          DEPLOY="${{ env.SERVICE_SLUG }}-predictor"
          DEPLOYED_IMG=$(kubectl get deploy "$DEPLOY" -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="'"$DEPLOY"'")].image}')
          echo "Deployed image: $DEPLOYED_IMG"
          [[ "$DEPLOYED_IMG" == *@sha256:* ]] || {
            echo "::error::image is NOT pinned by digest: $DEPLOYED_IMG"
            exit 1
          }
          echo "✓ Image is digest-pinned"

      - name: Capture cluster events (post-mortem on failure)
        if: always()
        run: |
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -50
          kubectl get pods --all-namespaces

      - name: Tear down kind
        if: always()
        run: kind delete cluster --name golden-path

  # ─────────────────────────────────────────────────────────────────
  # 4. AUDIT — verify the audit trail records the operation
  # ─────────────────────────────────────────────────────────────────
  audit-trail:
    name: Audit trail emits on a clean runner
    needs: admit-and-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run audit_record.py with NO ML deps installed
        # Closes the regression channel for audit High-1: if any future
        # change to common_utils/__init__.py reintroduces an eager
        # joblib/numpy import, this step fails.
        env:
          GITHUB_STEP_SUMMARY: /tmp/summary.md
        run: |
          set -euo pipefail
          mkdir -p ops
          python scripts/audit_record.py \
            --agent "Agent-K8sBuilder" \
            --operation "golden-path-e2e" \
            --environment "dev" \
            --base-mode AUTO \
            --final-mode AUTO \
            --result success \
            --inputs '{"workflow":"golden-path","run_id":"${{ github.run_id }}"}' \
            --outputs '{"sha":"${{ github.sha }}"}'
          test -f ops/audit.jsonl || { echo "::error::audit log not written"; exit 1; }
          echo "✓ Audit entry recorded"
          cat ops/audit.jsonl | tail -1 | jq .

      - name: Summarize on step summary
        if: always()
        # Reports the real outcome. This block used to print five ✓ marks
        # under `if: always()`, so a failed run still rendered a summary
        # claiming every stage passed — the job was red for eighteen
        # consecutive weeks while its own summary said otherwise.
        env:
          SCAFFOLD: ${{ needs.scaffold.result }}
          BUILD: ${{ needs.build-and-sign.result }}
          ADMIT: ${{ needs.admit-and-smoke.result }}
          AUDIT: ${{ job.status }}
        run: |
          mark() { [ "$1" = "success" ] && echo "✓" || echo "✗ ($1)"; }
          {
            echo "## Golden Path E2E (L3)"
            echo "- $(mark "$SCAFFOLD") Scaffolded service from template"
            echo "- $(mark "$BUILD") Built + signed image by digest"
            echo "- $(mark "$ADMIT") Kyverno admitted digest-pinned manifest, PSS enforced, smoke passed"
            echo "- $(mark "$AUDIT") Audit trail written on clean runner"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # A red L3 must reach a human.
  #
  # This workflow runs on a weekly schedule and on demand — never on a PR —
  # so its failures appear in no PR's checks and block nothing. It was red
  # every week from 2026-05-11 to 2026-09-07, eighteen runs, while README.md
  # offered L1+L2+L3 to adopters as "your contract". Nobody was told.
  #
  # Same mechanism the drift-detection workflow already uses: open an issue.
  # One issue, reopened and commented rather than duplicated, so eighteen
  # weeks of failure is one thread and not eighteen.
  # ---------------------------------------------------------------------
  notify-on-failure:
    name: Open an issue when L3 is red
    needs: [scaffold, build-and-sign, admit-and-smoke, audit-trail]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const label = 'golden-path-red';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const body = [
              `Golden Path E2E (verification layer **L3**) failed.`,
              ``,
              `Failed job(s): ${failed.map(f => `\`${f}\``).join(', ') || 'unknown'}`,
              `Run: ${runUrl}`,
              ``,
              `README.md offers L1 + L2 + L3 to adopters as their contract, so a red`,
              `L3 is a claim this repository is making and not meeting. It is not a`,
              `flake budget: fix it or change the claim.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.notice(`Commented on existing issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Golden Path E2E (L3) is failing',
                labels: [label, 'ci'],
                body,
              });
              core.notice(`Opened issue #${created.data.number}`);
            }
