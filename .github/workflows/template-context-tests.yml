# =============================================================================
# Template-context test lane — R6 audit S0-2.
#
# Gap it closes: the full `templates/service/tests` suite was not executed
# by ANY CI lane on the template repo itself. `policy-tests.yml` runs only
# `tests/policy/`; `validate-templates.yml` runs a post-scaffold subset.
# Several contract tests (dashboards inventory, networkpolicy egress
# hygiene, release-notes follow-ons, k8s name vocabulary) were silently
# red on main for weeks.
#
# Scope: every test EXCEPT those marked `scaffold_context` (tests that
# need a scaffolded service: data/ dirs, generated openapi snapshot,
# trained model). Those are exercised by the scaffold smoke in
# `validate-templates.yml` (SCAFFOLD_SMOKE=1) and the golden-path E2E.
# =============================================================================
name: Template-Context Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  template-context-tests:
    name: Full contract suite (template context)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: templates/service/requirements.txt

      - name: Install service requirements
        # requirements-dev.txt, NOT requirements.txt. It opens with
        # `-r requirements.txt` and adds the test tooling — pytest, httpx
        # (the TestClient transport), locust (the parity lane) and
        # jsonschema. Those four used to sit in requirements.txt itself,
        # which is how this step got away with installing one file; the
        # runtime/training split (ADR-049) moved them out, and installing
        # only the runtime set here would have failed every TestClient test
        # with `No module named 'httpx'`.
        #
        # Full set so the prediction logger and load_test module import
        # cleanly — partial installs were the source of 52 spurious lifespan
        # errors (R6 §S1-2). Copier is needed because policy tests scaffold a
        # service via new-service.sh.
        #
        # requirements-train.txt is deliberately NOT installed: a test that
        # needs mlflow or optuna belongs in a training lane.
        run: |
          python -m pip install --upgrade pip
          pip install -r templates/service/requirements-dev.txt
          pip install "copier>=9.0.0" pytest-asyncio

      - name: Root suite collects (AUDIT R8-05 guard)
        # Running pytest from the repo ROOT is a supported dev flow (root
        # pyproject carries [tool.pytest.ini_options]) but no lane executed
        # it, so a sys.modules collision between the three sibling `tests`
        # packages broke root collection without any CI signal. This step
        # pins the fix (--import-mode=importlib) by asserting the whole
        # repo COLLECTS from the root; scoped lanes below keep owning
        # execution.
        run: python -m pytest --collect-only -q -p no:locust > /dev/null

      - name: Run template-context suite
        # `-p no:locust`: locust self-registers as a pytest plugin and
        # gevent-monkey-patches ssl/socket on load, which deadlocks
        # anyio/TestClient lifespans (hang in epoll, not a failure —
        # the worst CI failure mode). Collection of load_test.py is
        # separately blocked by `collect_ignore` in tests/conftest.py.
        # templates/tests/governance holds the tests that guard THIS repository
        # — its README wording, its workflows, its config. They used to sit in
        # templates/service/tests, which is the Copier payload, so every
        # generated service shipped 15 test files that asserted about
        # `templates/...` paths it does not have: 147 failures out of the box.
        # They are listed here so moving them out of the payload did not move
        # them out of CI.
        # monitoring/tests + eda/tests are included explicitly: no lane ran
        # them before, so the alertmanager-routing module sat uncollectable
        # (stale parents[3] path) for weeks with zero CI signal (AUDIT R8).
        # amtool-authoritative tests self-skip when the binary is absent;
        # the pure-Python simulator half always runs.
        run: |
          python -m pytest \
            templates/service/tests \
            templates/tests/governance \
            templates/service/monitoring/tests \
            templates/service/eda/tests \
            -p no:locust \
            -m "not scaffold_context and not locust_parity" \
            -q --tb=short

      - name: Run locust-parity contract in isolation
        # Own process on purpose: importing locust monkey-patches
        # ssl/socket (gevent), which is fatal to any TestClient test
        # sharing the process — and the import fires at COLLECTION time,
        # so conftest collect_ignore (not a -m filter) gates it, keyed
        # on RUN_LOCUST_PARITY. Fresh interpreter = patch applies before
        # asyncio exists = safe.
        env:
          RUN_LOCUST_PARITY: "1"
        run: |
          python -m pytest \
            templates/service/tests/test_load_payload_matches_schema.py \
            -q --tb=short
