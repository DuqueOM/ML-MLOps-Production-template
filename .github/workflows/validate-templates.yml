# Validate Templates CI
# Proves the repo is alive — validates K8s, Terraform, and Python templates.
# Runs on every push and PR to main.

name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # Self-audit (ADR-014 §3.3, gap #16)
  # The template prescribes gitleaks/trivy/checkov for downstream services.
  # Apply the same tooling to the template repo itself — a template that
  # does not pass its own gates is not credible.
  #
  # The name is deliberately tool-agnostic. It used to enumerate the tools
  # ("gitleaks + tfsec + checkov + trivy fs"), which made it wrong the moment
  # ADR-046 swapped one of them — and because it is a required status check,
  # correcting it cost a three-step ruleset transition. Naming the CLASSES of
  # check instead means the next tool swap touches no contract at all.
  # See docs/governance/branch-protection.md §"Renaming a required check".
  # ---------------------------------------------------------------------
  self-audit:
    name: Self-audit (secrets + IaC + supply chain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for sarif upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # gitleaks needs history

      # 1. gitleaks — secret scanning over committed files + git history.
      #    Failure means a credential pattern was committed; D-17 violation.
      #
      #    ⚠️ VERSION INVARIANT (GITLEAKS_VERSION below)
      #    This installs an EXPLICIT, pinned binary instead of
      #    `gitleaks/gitleaks-action`, because the action bundles a gitleaks
      #    version this repo does not control. That is how the local hook
      #    (v8.21.2) and CI silently diverged on CONFIG DIALECT: gitleaks
      #    < 8.25 ignores the plural `[[allowlists]]` tables in
      #    `.gitleaks.toml`, >= 8.25 honours them and rejects the singular
      #    `[allowlist]` form outright. Two scans of the same tree applied
      #    different allowlists and neither reported a problem.
      #
      #    The version below MUST equal the `rev:` of the gitleaks hook in
      #    BOTH `.pre-commit-config.yaml` and
      #    `templates/service/.pre-commit-config.yaml`. Three places, one
      #    version, bumped together. `scripts/check_gitleaks_pin.py`
      #    enforces this and fails CI if they drift.
      #
      #    `--config` is passed explicitly: the previous step relied on the
      #    action's config auto-discovery, so a config it silently failed to
      #    load would have degraded to default rules without any signal.
      - name: gitleaks pin drift (3 sites must agree)
        run: python3 scripts/check_gitleaks_pin.py

      - name: Adopter scaffold command pins the current release
        run: python3 scripts/check_adopter_scaffold_ref.py

      - name: Generated service ADR references are resolvable
        run: python3 scripts/check_service_adr_references.py

      - name: Template and service markdownlint rules agree
        run: python3 scripts/check_markdownlint_parity.py

      - name: Payload tests are about the generated service
        run: python3 scripts/check_payload_test_scope.py

      - name: Render root parses as Copier templates
        # jinja2 is installed explicitly: the gate exits 2 when its parser is
        # missing rather than skipping, so a job that lacks it fails loudly
        # instead of reporting a pass it never earned.
        run: |
          set -euo pipefail
          pip install --quiet jinja2 pyyaml
          python3 scripts/check_template_render_safety.py

      - name: gitleaks (D-17)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # `detect` walks git history (checkout used fetch-depth: 0).
          # --redact: never print a matched secret into a public build log.
          /tmp/gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --no-banner

      # 2. Hardcoded credential patterns the template specifically warns
      #    about. Mirror of the security-audit job inside the service CI
      #    (templates/service/.github/workflows/ci.yml) — applied to the template's own files.
      - name: Hardcoded credential patterns (D-17 redux)
        run: |
          set -euo pipefail
          # Excludes: rule/doc/test files that legitimately ship canonical
          # synthetic EXAMPLE patterns (same allowlist lives in
          # .gitleaks.toml) and self-referential files whose own comments
          # contain the patterns the grep is looking for.
          # GNU grep --include/--exclude ordering matters: --include must
          # precede --exclude for both to be honoured during recursion.
          if grep -rEI \
                 --include='*.py' --include='*.yaml' --include='*.yml' \
                 --include='*.tf' --include='*.json' --include='*.md' \
                 --include='*.sh' \
                 --exclude-dir=.git --exclude-dir=node_modules \
                 --exclude-dir=tests \
                 --exclude='*.lock' --exclude='*.png' --exclude='*.gif' \
                 --exclude='secret-history-scan.md' \
                 --exclude='test_memory_redaction.py' \
                 --exclude='validate-templates.yml' \
                 --exclude='.gitleaks.toml' \
                 "AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}" \
                 .; then
            echo "::error::Hardcoded credential pattern detected in the template repo (D-17)."
            exit 1
          fi
          # Direct os.environ access for secret-shaped names — production code only.
          # Excludes: tests, docs, ADRs, runbooks (documenting the anti-pattern).
          if grep -rEI \
                 "os\.environ\[.(API_KEY|SECRET|TOKEN|PASSWORD)" \
                 --include="*.py" \
                 --exclude-dir=tests --exclude-dir=docs \
                 templates/ scripts/; then
            echo "::error::Direct os.environ on secret-named keys (D-17). Use common_utils.secrets.get_secret."
            exit 1
          fi

      # 3. Terraform IaC security, against the template's own modules.
      #    May 2026 audit HIGH-1: flipped from `soft_fail: true` to hard-fail.
      #
      # ADR-046: tfsec is archived upstream ("engineering attention will be
      # directed at Trivy going forward" — the binary prints it on startup)
      # and was pinned to its last release, v1.28.14. Trivy config is the
      # successor and was already installed in this job for the filesystem
      # scan, so this is a swap rather than a new dependency.
      #
      # Measured before switching, at the HIGH gate threshold:
      #   tfsec, suppressions removed:  4 findings (all GCP)
      #   trivy config, same modules:   1 finding
      # Two of the three suppressions dissolve because trivy evaluates what
      # tfsec could not. The third survives and is baselined. See ADR-046.
      #
      # Coverage also widens from two modules to five: bootstrap and
      # cloudflare were never scanned by tfsec, matching the gap #78 closed
      # for `terraform validate`.
      # One recursive scan reaches all five root modules (gcp, aws, their two
      # bootstrap layers, and cloudflare). tfsec only ever ran on gcp and
      # aws, so this also closes the coverage gap #78 closed for
      # `terraform validate`. Same pinned action as the filesystem scan
      # below — the binary is not on PATH for a plain `run:` step.
      - name: Trivy config (Terraform IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: templates/service/infra/terraform
          # Every severity is enforced. The threshold walked up as the triage
          # was done, not before it:
          #
          #   HIGH    -> MEDIUM  once the 5 MEDIUM were triaged. Three were
          #                      real (default node service account ×2, a
          #                      project-wide serviceAccountUser grant).
          #   MEDIUM  -> LOW     once the 8 LOW were triaged. Seven were real
          #                      (4 buckets without CMEK, 2 unpinned node
          #                      images, an unlabelled cluster) and are fixed;
          #                      the state bucket gained access logging.
          #
          # "Below the threshold" turned out to predict nothing about whether
          # a finding mattered: 10 of the 13 sub-threshold findings were real
          # defects. What remains is baselined with a dated justification, so
          # the gate is now exhaustive rather than selective — anything new,
          # at any severity, blocks until someone decides about it.
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "1"
          trivyignores: .security-baselines/trivy-config.trivyignore
          format: table

      # 4. Checkov — broader IaC checks (Terraform + K8s + Dockerfile).
      #    May 2026 audit HIGH-1: hard-fail with `--check` against the
      #    repo's enforced rule set in `.security-baselines/checkov.yml`.
      #    `--skip-check` items must each carry a `# checkov:skip=` comment
      #    documenting the why next to the resource (NOT in the workflow).
      - name: Checkov (IaC + K8s + Dockerfile)
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: templates/
          framework: terraform,kubernetes,dockerfile
          quiet: true
          soft_fail: false
          config_file: .security-baselines/checkov.yml

      # 5. Trivy filesystem scan — catches CVEs in committed manifests
      #    (e.g. base images referenced in Dockerfile, requirements.txt).
      #    May 2026 audit HIGH-1: exit-code: 1 on CRITICAL/HIGH; baseline
      #    of accepted CVEs lives in `.security-baselines/trivy-fs.trivyignore`.
      #
      #    This used to be ONE step pointed at `templates/`, nominally covering
      #    both secrets and Python dependency vulnerabilities. It covered
      #    neither well: every run logged
      #      `Number of language-specific files  num=0`
      #      `WARN [report] Supported files for scanner(s) not found. scanners=[vuln]`
      #    because trivy reads a requirements file only when versions are
      #    pinned exactly, and this repo mandates `~=` (numpy 2.x silently
      #    corrupts joblib models) with no lock file. A blocking gate that has
      #    never examined a dependency is worse than no gate: it produces the
      #    assurance without the check. It is now two steps that each say what
      #    they do.
      - name: Trivy secret scan (templates tree)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: templates/
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Resolve Python dependencies to exact versions
        # pip resolves; nothing is installed. The script fails when it finds no
        # requirements files, or when one resolves to no packages — an empty
        # resolution is indistinguishable from a clean scan, which is the
        # defect being fixed here.
        run: python3 scripts/resolve_python_dependencies.py /tmp/resolved-deps

      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: /tmp/resolved-deps
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .security-baselines/trivy-fs.trivyignore
          # `list-all-pkgs` makes the package inventory appear per target even
          # when a target has no findings. Without it trivy omits clean targets
          # entirely, and the coverage assertion below could not tell "scanned
          # and clean" from "never parsed".
          list-all-pkgs: true
          format: json
          output: /tmp/trivy-deps.json

      - name: Scan must have examined every resolved file
        # The gate this replaces exited 0 having read zero files, and trivy
        # reports that as success. Counting is the only way to tell "clean"
        # from "checked nothing" — and an exact comparison, not `> 0`, because
        # trivy matches `requirements.txt` by name and silently skips anything
        # else: during this change 3 of 4 files were being parsed and the
        # difference was invisible.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          resolved = sorted(p for p in Path("/tmp/resolved-deps").rglob("requirements.txt"))
          report = json.loads(Path("/tmp/trivy-deps.json").read_text())
          parsed = [r.get("Target") for r in (report.get("Results") or [])]
          if len(parsed) != len(resolved):
              sys.stderr.write(
                  f"::error::resolved {len(resolved)} requirements file(s) but trivy "
                  f"parsed {len(parsed)}. Unparsed files are silently unscanned.\n"
              )
              for r in resolved:
                  rel = r.relative_to("/tmp/resolved-deps").as_posix()
                  if rel not in parsed:
                      sys.stderr.write(f"::error::  not parsed: {rel}\n")
              raise SystemExit(1)
          pkgs = sum(len(r.get("Packages") or []) for r in report["Results"])
          print(f"[deps-scan] {len(parsed)} file(s), {pkgs} packages examined")
          PY

      # 6. Toolchain-install hygiene (PR-R2-5, audit R2 §5).
      #    The audit called out `curl -s … | bash` and
      #    `releases/latest/download/` as the two weak links in the
      #    supply-chain story: they run arbitrary upstream shell code
      #    and they pin to a moving target that can change behaviour
      #    between two CI runs. The canonical replacement is a pinned
      #    direct-release-tarball download (see golden-path.yml and
      #    validate-templates.yml itself for examples).
      - name: Toolchain install hygiene (PR-R2-5)
        run: |
          set -euo pipefail
          status=0
          search_dirs=".github/workflows templates/service/.github/workflows"

          # Drop grep-format lines that are YAML comments
          # (`file:lineno:     # ...`). This lint scans every workflow
          # — including itself — so the patterns below are assembled
          # from concatenated string fragments to avoid self-matching
          # without needing to exclude validate-templates.yml from its
          # own scan (which would create a coverage hole).
          filter() {
            grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true
          }

          # Patterns are assembled from concatenated halves so this
          # script's own source does not contain the literal forbidden
          # strings — keeps the lint self-stable without self-exclusion
          # tricks beyond the file filter above.
          pat_pipe='curl[^|]*[|][[:space:]]*bash'
          pat_latest='releases/'"latest"'/download/'
          pat_install_sh='install_'"kustomize"'.sh'

          # A. No curl-piped-into-shell anywhere in workflow YAML.
          hits=$(grep -rnE "$pat_pipe" \
                   --include='*.yml' --include='*.yaml' $search_dirs \
                 | filter)
          if [ -n "$hits" ]; then
            echo "::error::Found curl-piped-into-shell in a workflow (see PR-R2-5):"
            echo "$hits"
            status=1
          fi

          # B. Always pin the version, never use the moving 'latest' alias.
          hits=$(grep -rnE "$pat_latest" \
                   --include='*.yml' --include='*.yaml' $search_dirs \
                 | filter)
          if [ -n "$hits" ]; then
            echo "::error::Unpinned release URL detected (PR-R2-5). Use '/releases/download/<explicit-version>/'."
            echo "$hits"
            status=1
          fi

          # C. Deny-listed installer shell script from the upstream
          # kustomize hack/ directory — this was the concrete failure
          # reported by the audit.
          hits=$(grep -rn "$pat_install_sh" \
                   --include='*.yml' --include='*.yaml' $search_dirs \
                 | filter)
          if [ -n "$hits" ]; then
            echo "::error::Deny-listed kustomize installer detected (PR-R2-5). Use the direct /releases/download/ tarball."
            echo "$hits"
            status=1
          fi

          exit $status

      # 7. Markdown link-check (lightweight; full link-check moves to
      #    Phase 5 §5.2 alongside markdown-link-check + spell).
      - name: Quick check that AGENTS.md cites no broken local files
        run: |
          set -euo pipefail
          # Extract markdown links pointing at local files (not http/https).
          # Fail if any cited path does not exist.
          missing=0
          while read -r path; do
            [ -z "$path" ] && continue
            if [ ! -e "$path" ] && [ ! -e "$(dirname AGENTS.md)/$path" ]; then
              echo "::error file=AGENTS.md::referenced path not found: $path"
              missing=$((missing + 1))
            fi
          done < <(grep -oE '\]\([^)]+\.(md|py|yaml|yml|sh|json|toml|tf)\)' AGENTS.md \
                     | sed -E 's/^\]\(//;s/\)$//' | grep -v '^http')
          [ "$missing" -eq 0 ] || exit 1


  python-quality:
    name: Python Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pre-commit + local-hook deps
        # The pre-commit framework itself + the deps the LOCAL hooks
        # need (validate-agentic, ci-autofix-policy-contract). Remote
        # hooks (ruff/mypy/bandit/gitleaks) bring their
        # own envs via pre-commit; only locals share this Python.
        run: |
          pip install pre-commit
          # jinja2 is for template-render-safety, which parses the Copier
          # render root with Copier's own delimiters. It refuses to run
          # without it (exit 2) rather than skipping, so the dependency has
          # to be here — a gate that passes when its parser is missing is
          # the failure mode it exists to catch.
          pip install pytest pyyaml jsonschema jinja2

      - name: Run pre-commit hooks (ruff, mypy, bandit, gitleaks)
        # Single source of truth for versions: .pre-commit-config.yaml.
        # Prevents version drift between CI and local pre-commit install.
        # Runs all commit-stage hooks (excludes pre-push scaffold smoke).
        run: pre-commit run --all-files --hook-stage commit

      - name: Schema-validation wiring (PR-R2-4, audit R2)
        # Pandera ServiceInputSchema must be the SINGLE SOURCE OF TRUTH
        # consumed by training, serving, AND drift detection. The audit
        # found serving + drift bypassed it; this lint guards against
        # silent regressions.
        #
        # Required wiring:
        #   * fastapi_app.py imports validate_predict_payload AND calls it
        #   * fastapi_app.py imports validate_predict_batch AND calls it
        #   * drift_detection.py imports validate_drift_dataframe AND calls it
        #   * app/_pandera_schema.py exists (lazy resolver for {service}.schemas)
        run: |
          set -euo pipefail
          status=0
          fastapi_app="templates/service/app/fastapi_app.py"
          drift_py="templates/service/src/{@ service_slug @}/monitoring/drift_detection.py"

          if [ ! -f templates/service/app/_pandera_schema.py ]; then
            echo "::error::templates/service/app/_pandera_schema.py is missing (PR-R2-4)."
            status=1
          fi

          for symbol in validate_predict_payload validate_predict_batch; do
            if ! grep -q "from common_utils.input_validation" "$fastapi_app"; then
              echo "::error file=$fastapi_app::missing 'from common_utils.input_validation' import (PR-R2-4)."
              status=1
              break
            fi
            # Two occurrences expected: import + call site. Anything else
            # means someone removed the wiring or deleted the call.
            count=$(grep -c "$symbol" "$fastapi_app" || true)
            if [ "$count" -lt 2 ]; then
              echo "::error file=$fastapi_app::expected import + call for $symbol (got $count occurrences)."
              status=1
            fi
          done

          if ! grep -q "validate_drift_dataframe" "$drift_py"; then
            echo "::error file=$drift_py::drift_detection.py must call validate_drift_dataframe before PSI (PR-R2-4)."
            status=1
          fi
          if ! grep -q "DriftSchemaError" "$drift_py"; then
            echo "::error file=$drift_py::drift_detection.py must catch DriftSchemaError and exit 3 (PR-R2-4)."
            status=1
          fi

          exit $status

  kubernetes-validate:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubeconform
        # Pinned version, direct release tarball (no unauthenticated GH
        # API call, no `curl | bash`). Upgrading this pin is an explicit
        # PR; the CI lint added in PR-R2-5 rejects future :latest /
        # raw.githubusercontent.com / hack-dir installs.
        run: |
          set -euo pipefail
          KCVER=v0.6.7
          curl -sSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KCVER}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -v

      - name: Install kustomize
        # Direct release tarball (not raw.githubusercontent.com/hack/).
        # The upstream install_kustomize.sh piped into bash hit the
        # unauthenticated GitHub releases API and failed under the
        # per-IP rate limiter; see golden-path.yml for the same pattern.
        run: |
          set -euo pipefail
          KVER=v5.4.3
          curl -sSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KVER}/kustomize_${KVER}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      - name: Validate manifests (base + every overlay)
        # Was: seven base manifests named literally, plus a bare
        # `kustomize build base/ > /dev/null`. `k8s/base/` holds fourteen
        # manifests, so seven were unvalidated — `pdb.yaml` and
        # `networkpolicy-deny-default.yaml` among them, both core API types
        # kubeconform checks in full — and no overlay was validated at all.
        #
        # The shared script globs the directory instead of naming files, and
        # fails when it discovers nothing. It is byte-identical to the copy
        # the generated service runs (`check_vendored_runtime_drift.py`), so
        # this repo cannot validate its own manifests to a different bar than
        # the one it ships.
        run: bash scripts/validate_k8s_manifests.sh templates/service/k8s

      - name: Base neutrality lint (PR-R2-3, audit R2)
        # The base manifest must NOT carry environment-specific values;
        # those belong in overlays. Regressions from this rule made
        # `environment: production` ship in dev deployments and forced
        # operators to debug "why is this pod labeled production?".
        #
        # Allowed in base:
        #   * `replicas:` >= HPA `minReplicas` (the floor)
        #   * `namespace: ml-services` ONLY in kustomization.yaml
        #     (default for `kustomize build base/` standalone)
        # Forbidden in base RESOURCES (deployment/rbac/networkpolicy/
        # promrule/etc.):
        #   * `environment: <anything>` label
        #   * explicit `namespace:` field
        #   * `replicas:` below HPA minReplicas
        run: |
          set -euo pipefail
          status=0
          # 1. No `environment:` label in base resources
          if grep -nE '^[[:space:]]+environment:' \
               templates/service/k8s/base/*.yaml; then
            echo "::error::Base manifests must not hardcode an environment label (PR-R2-3). Move it to the overlay."
            status=1
          fi
          # 2. No explicit `namespace:` outside kustomization.yaml.
          # Match `namespace:` at any indentation, on yaml files other
          # than kustomization.yaml.
          if grep -nE '^[[:space:]]+namespace:' \
               templates/service/k8s/base/*.yaml \
               | grep -v '^templates/service/k8s/base/kustomization.yaml:' \
               | grep -v '^templates/service/k8s/base/[^:]*:[0-9]*:[[:space:]]*#' ; then
            echo "::error::Base resources must not hardcode namespace: -- overlay namespace field is the single source of truth (PR-R2-3)."
            status=1
          fi
          # 3. Base deployment replicas must be >= HPA minReplicas.
          dep_replicas=$(grep -E '^[[:space:]]+replicas:' templates/service/k8s/base/deployment.yaml | head -1 | awk '{print $2}')
          hpa_min=$(grep -E '^[[:space:]]+minReplicas:' templates/service/k8s/base/hpa.yaml | head -1 | awk '{print $2}')
          if [ -n "$dep_replicas" ] && [ -n "$hpa_min" ] && [ "$dep_replicas" -lt "$hpa_min" ]; then
            echo "::error::Deployment replicas ($dep_replicas) < HPA minReplicas ($hpa_min); HPA cannot scale below its floor (PR-R2-3)."
            status=1
          fi
          exit $status

      - name: Image digest pinning (PR-R2-2, audit R2)
        # Audit finding: init container `google/cloud-sdk:slim` and
        # CronJob `{service}-predictor:latest` lived outside the
        # signed/digest-pinned image chain. Now every overlay maps
        # `cloud-cli-image` via Kustomize, so digest pinning at the
        # overlay level reaches BOTH the deployment AND every CronJob
        # that uses {service}-predictor.
        #
        # Behavior tiers:
        #   *-dev    : warn-only (moving tags allowed)
        #   *-staging: warn-only (operator may pin via bootstrap runbook)
        #   *-prod   : warning today; flips to error in PR-R2-3 once the
        #              bootstrap runbook is exercised in CI
        run: |
          set -euo pipefail
          status=0
          # Discovered, not listed. The literal six omitted `batch-only`, so
          # its rendered output was never checked for a `:latest` image — the
          # hard rule below — even though that overlay ships a CronJob with
          # its own image reference.
          mapfile -t OVERLAYS < <(cd templates/service/k8s/overlays && ls -d */ | sed 's|/$||')
          if [ ${#OVERLAYS[@]} -eq 0 ]; then
            echo "::error::no overlays found — a loop over nothing reports the same green as a full pass"
            exit 1
          fi
          echo "Checking ${#OVERLAYS[@]} overlays: ${OVERLAYS[*]}"
          for overlay in "${OVERLAYS[@]}"; do
            rendered=$(kustomize build "templates/service/k8s/overlays/$overlay")
            unpinned=$(echo "$rendered" \
              | grep -E '^[[:space:]]+image:' \
              | grep -v '@sha256:' || true)
            if [ -n "$unpinned" ]; then
              case "$overlay" in
                *-prod)
                  echo "::warning::[$overlay] image refs not pinned by digest:"
                  echo "$unpinned" | sed "s|^|::warning::[$overlay]   |"
                  echo "::warning::PR-R2-3 will harden this to a hard error once the bootstrap runbook is wired."
                  ;;
                *)
                  echo "[$overlay] image refs not pinned by digest (allowed in $overlay tier):"
                  echo "$unpinned" | sed "s|^|[$overlay]   |"
                  ;;
              esac
            fi
            # Hard rule (already in scope today): no `:latest` literal in
            # any rendered overlay output. Operators who want moving tags
            # in dev should use a versioned tag, not `:latest`, so audit
            # trail records what was actually deployed.
            if echo "$rendered" | grep -E '^[[:space:]]+image:.*:latest( |$)'; then
              echo "::error file=templates/service/k8s/overlays/$overlay::Rendered overlay contains a ':latest' image reference. Use a versioned tag or pin by digest."
              status=1
            fi
          done
          exit $status

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.0"

      - name: Validate GCP (live)
        run: |
          cd templates/service/infra/terraform/gcp
          terraform init -backend=false -upgrade=false
          terraform validate

      - name: Validate AWS (live)
        run: |
          cd templates/service/infra/terraform/aws
          terraform init -backend=false -upgrade=false
          terraform validate

      # ADR-015 PR-A2 — bootstrap layer: state bucket + KMS + registry.
      # Bootstrap uses LOCAL state (chicken-and-egg with the bucket it
      # creates), so `init -backend=false` is the natural fit even though
      # there's no `backend` block to disable.
      - name: Validate GCP (bootstrap)
        run: |
          cd templates/service/infra/terraform/gcp/bootstrap
          terraform init -backend=false -upgrade=false
          terraform validate

      - name: Validate AWS (bootstrap)
        run: |
          cd templates/service/infra/terraform/aws/bootstrap
          terraform init -backend=false -upgrade=false
          terraform validate

      # ADR-042 / D-38 — Cloudflare is one of the three accepted edge
      # protection components (alongside Cloud Armor and AWS WAFv2). It is
      # a root module with its own `required_providers`, so it needs its
      # own validate step; without one a provider bump could break the
      # module and CI would stay green.
      - name: Validate Cloudflare (edge protection)
        run: |
          cd templates/service/infra/terraform/cloudflare
          terraform init -backend=false -upgrade=false
          terraform validate

  example-e2e:
    name: Example End-to-End (train → serve → test → drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: examples/minimal/requirements.txt

      - name: Install dependencies
        run: pip install -r examples/minimal/requirements.txt

      - name: Train model
        working-directory: examples/minimal
        run: python train.py

      - name: Verify artifacts exist
        working-directory: examples/minimal
        run: |
          test -f artifacts/model.joblib
          test -f artifacts/metrics.json
          test -f artifacts/reference.csv
          echo "✓ All training artifacts generated"

      - name: Start API server
        working-directory: examples/minimal
        run: |
          uvicorn serve:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -sf http://localhost:8000/health | python -m json.tool
          echo "✓ API server healthy"

      - name: Run tests (health + predict + drift check + SHAP)
        working-directory: examples/minimal
        run: pytest test_service.py -v --tb=short

      - name: Run drift detection
        working-directory: examples/minimal
        run: |
          # Exit codes: 0=no drift, 1=warning, 2=alert — all valid demo outcomes
          # The demo intentionally simulates drift, so exit 2 is expected
          python drift_check.py || [ $? -le 2 ]

      - name: Verify quality gates from metrics
        working-directory: examples/minimal
        run: |
          python -c "
          import json
          m = json.load(open('artifacts/metrics.json'))
          assert m['all_passed'], f'Quality gates failed: {m}'
          assert m['roc_auc'] >= 0.65, f'ROC-AUC {m[\"roc_auc\"]} < 0.65'
          print(f'✓ Quality gates passed: ROC-AUC={m[\"roc_auc\"]:.4f}, F1={m[\"f1_score\"]:.4f}, DIR={m[\"disparate_impact_ratio\"]:.4f}')
          "

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: templates/service/Dockerfile
          failure-threshold: error

  agentic-system:
    name: Agentic System Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate agentic configuration (strict)
        # Verifies: rule frontmatter + glob matching, skill SKILL.md contracts,
        # workflow frontmatter, and AGENTS.md cross-references.
        # --strict treats warnings (missing fields, broken cross-references)
        # as failures. Glob misses are reported as informational notes only,
        # so this stays green as the template grows downstream-only patterns.
        run: |
          pip install --quiet pyyaml
          python scripts/validate_agentic.py --strict

      - name: Shell script syntax check
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/_lib/*.sh
          bash -n scripts/test_scaffold.sh
          echo "✓ All shell scripts parse cleanly"

  security-baseline-expiry:
    name: Security Baseline Expiry Gate
    runs-on: ubuntu-latest
    # May 2026 audit ADR-024 follow-up to HIGH-1.
    # Every accepted finding in `.security-baselines/` must carry an
    # `# expiry: YYYY-MM-DD` annotation. This job fails the PR when an
    # entry is past due OR missing the annotation, forcing either a
    # fresh ADR + extension or a real fix. Path to zero-baseline by v1.0.0.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check baseline entry expiries
        run: python3 scripts/check_baselines_expiry.py

  test-clock-isolation:
    name: Test Clock Isolation Contract
    runs-on: ubuntu-latest
    # Hardening lesson from the 2026-05-04 feedback triage:
    # a behavioral test broke when the user ran the suite at 20:52 UTC
    # because a test helper (transitively) read the wall clock. This
    # contract scans test files for direct datetime.now / time.time
    # calls and gates them through a curated allowlist with one-line
    # justifications. Cheap signal that prevents the same shape of
    # bug from reaching main again. See
    # docs/audit/feedback-may-2026-triage.md §"Closure summary".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check test clock isolation
        run: python3 scripts/check_test_clock_isolation.py

  dependency-contract:
    name: Dependency Partition + Pin Coherence Gates
    runs-on: ubuntu-latest
    # Its own job rather than steps appended to another. The first attempt
    # bolted these onto the clock-isolation job, which installs nothing —
    # check_dependency_partition.py imports pyyaml and died on a job whose
    # name says it is about clocks. A gate in a job that does not describe it
    # is a gate nobody knows how to fix when it goes red.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: pip install --quiet pyyaml

      - name: Check dependency partition (ADR-049)
        # requirements.txt is what the Dockerfile installs. An unguarded import
        # of a training-only package on a path the image runs would put mlflow
        # and optuna back into every inference pod — 20 of this service's 24
        # fixable CRITICAL/HIGH advisories, all 7 CRITICAL among them. Also
        # rejects a lane that installs the runtime set and then runs pytest.
        run: python3 scripts/check_dependency_partition.py

      - name: Check dependency pin coherence (ADR-048)
        # templates/service/requirements.txt and eda/requirements.txt are
        # installed into ONE environment by docs/TUTORIAL.md and disagreed on
        # scikit-learn (~=1.5.0 vs ~=1.9) and pandera (~=0.23.0 vs ~=0.33), so
        # the tutorial's own install sequence silently upgraded the service's
        # pins out from under it.
        run: python3 scripts/check_dependency_pin_coherence.py

  agentic-adapter-drift:
    name: Agentic Adapter Drift Gate
    runs-on: ubuntu-latest
    # External-feedback gap 6.3 (May 2026 triage). The IDE adapter
    # files under .cursor/, .claude/, and .codex/ are GENERATED from agentic/
    # from the manifest in templates/config/agentic_manifest.yaml +
    # source rules in agentic/rules/. Pre-commit only runs the
    # *structural* validator (validate_agentic.py); the *drift*
    # check (sync_agentic_adapters.py --check) had no CI gate, so a
    # PR could merge with stale adapters and the IDE-parity contract
    # would silently regress. This job fixes that.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Check adapter drift
        run: python3 scripts/sync_agentic_adapters.py --check

  dashboard-inventory:
    name: Grafana Dashboard Inventory Gate
    runs-on: ubuntu-latest
    # May 2026 feedback triage gap 6.4. Every dashboard JSON shipped
    # under templates/service/monitoring/grafana/ must be registered in
    # INDEX.md. Prevents drift between "shipped" and "documented".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check dashboard inventory
        run: python3 scripts/check_dashboard_inventory.py

  common-utils-drift:
    name: common_utils Drift Gate (ADR-025 Option A)
    runs-on: ubuntu-latest
    # ADR-025 Option A: until common_utils is distributed as a proper
    # package, templates/service/common_utils/ MUST remain placeholder-free.
    # Copier renders it verbatim; any placeholder here would silently fork
    # adopters' scaffolded copies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check common_utils for scaffold-rewriteable placeholders
        run: python3 scripts/check_common_utils_drift.py

  cicd-template-drift:
    name: CI/CD Template Drift Gate
    runs-on: ubuntu-latest
    # Dependabot's github-actions ecosystem only scans .github/workflows/.
    # Action references anywhere under templates/ age silently and
    # propagate to every scaffolded service (and, for templates/governance/,
    # into the adopter's own workflows). This gate fails when a shared
    # action's version in templates lags the runtime workflows.
    # See docs/governance/cicd-templates-drift.md for the full rationale.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check templates/ vs .github/workflows for action drift
        run: python3 scripts/check_cicd_template_drift.py

  doc-path-refs:
    name: Documentation Path Reference Gate
    runs-on: ubuntu-latest
    # A path named in prose is a checkable claim. The Copier migration
    # (ADR-030) moved the scaffolder payload under templates/service/ and
    # updated every reference that executes; 30 documents kept pointing at
    # directories that no longer existed, and the dead path later reached
    # the audit tooling itself. Nothing caught it because nothing checked.
    # See docs/governance/doc-path-references.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check documentation path references resolve
        run: python3 scripts/check_doc_path_refs.py
      - name: Check "Enforced by" claims are traceable
        # A comment asserting a control cannot be verified; this checks the
        # half that is decidable. Three times in one review cycle a comment
        # named a control that was absent — see the script docstring.
        run: python3 scripts/check_control_claims.py

      - name: Check the ADR index is current
        # docs/COMPLIANCE_MAPPING.md cites this index as EU AI Act Art. 11
        # evidence. A stale index is a falsifiable compliance claim.
        run: python3 scripts/generate_adr_index.py --check

  vendored-runtime-drift:
    name: Vendored Runtime Drift Gate
    runs-on: ubuntu-latest
    # Copier renders only templates/service/, so a handful of repo-root tools
    # and runbooks that a scaffolded service needs at runtime
    # (validate_quality_gates.py, audit_record.py, drift/retrain runbooks) are
    # vendored into templates/service/. This gate fails when a vendored copy
    # drifts from its canonical repo-root original.
    # See scripts/check_vendored_runtime_drift.py for the full rationale.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check vendored runtime files match canonical originals
        run: python3 scripts/check_vendored_runtime_drift.py

  doc-coherence-gate:
    name: Documentation Coherence Gate (rule 16, ADR-031)
    runs-on: ubuntu-latest
    # Rule 16 / ADR-031: every fact restated across documents has one source
    # of truth and may not drift from it. This deterministic gate fails when
    # VERSION ≠ CHANGELOG, llms.txt lags the version, the anti-pattern count
    # or agentic surface counts disagree across docs, or an ADR number is
    # silently dropped without a tombstone. The `doc-coherence` skill fixes
    # drift; this gate enforces it (agents accelerate, CI enforces).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check cross-document coherence
        run: python3 scripts/check_doc_coherence.py

  scaffold-e2e:
    name: Scaffolder End-to-End Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest "copier>=9.0.0" jsonschema

      - name: Install kustomize
        # Direct release tarball, pinned version (PR-R2-5).
        run: |
          set -euo pipefail
          KVER=v5.4.3
          curl -sSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KVER}/kustomize_${KVER}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      - name: Run Copier scaffold end-to-end test
        # Executes `copier copy` via templates/scripts/new-service.sh in a
        # tmp dir. With SCAFFOLD_SMOKE=1, additionally:
        #   - creates a venv for the scaffolded service
        #   - installs requirements.txt
        #   - generates tests/contract/openapi.snapshot.json
        #   - runs pytest on test_api.py + test_training.py + contract/
        #
        # Without the flag, only structural validations run (kustomize,
        # Jinja tokens, syntax) — kept fast for local invocation.
        env:
          SCAFFOLD_SMOKE: "1"
        run: bash scripts/test_scaffold.sh
