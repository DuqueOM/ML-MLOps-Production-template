name: Docs Quality

# Catches the most common drift modes in markdown:
#   - links to local files that no longer exist
#   - external links that 404
#   - markdown-lint style issues (heading hierarchy, fenced code lang, etc.)
#
# Runs on PR and weekly schedule. Weekly run catches link rot in
# external sites (HN posts, vendor docs) without blocking PRs on
# unrelated outages.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-quality.yml"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — weekly link rot probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run markdown-link-check
        # Pinned to immutable tag (D-19 / ADR-014 §1.1). Dependabot
        # bumps via .github/dependabot.yml.
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          # Only check files in the PR diff; on schedule check all.
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
          config-file: ".github/markdown-link-check.json"
          # On weekly schedule, scan everything; on PR, only changed files.
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          # The action defaults to `master`; our default branch is `main`,
          # so the diff resolution `git diff origin/<base>...HEAD` fails
          # without this override (it was emitting
          # `fatal: couldn't find remote ref master`).
          base-branch: "main"

  markdown-lint:
    name: Markdown Lint (style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Config must exist and declare a scope
        # Without `.markdownlint-cli2.jsonc` the action runs with no globs,
        # finds no files, reports "0 issues in 0 files" and exits 0. A gate
        # that passes because it checked nothing is the failure this repo
        # keeps finding, so the config's existence is itself checked.
        run: |
          set -euo pipefail
          test -f .markdownlint-cli2.jsonc
          grep -q '"globs"' .markdownlint-cli2.jsonc

      - name: Run markdownlint-cli2
        # Blocking. It ran `continue-on-error: true` from the day it was added
        # ("warn-only first run; flip to false after triage"), with no config
        # file at all, reporting 8,584 issues in 474 files on every run and
        # blocking nothing. That triage is done: the rule set is declared in
        # `.markdownlint-cli2.jsonc` with a reason beside every disabled rule,
        # and the repository is at zero findings.
        #
        # No `globs:` here on purpose. The action's input would override the
        # config file's `globs`, and the two would drift — a local run and CI
        # would then check different files. The config is the single source.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
