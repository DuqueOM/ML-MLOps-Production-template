# Pre-commit hooks — MANDATORY first-filter for contributors.
#
# This is the FIRST gate before any code enters the repo. CI is the
# last-line safety net (it re-runs these same hooks on every PR via
# `validate-templates.yml`), but pre-commit must catch the 90% case
# at commit time, before a PR is even opened. If pre-commit is green
# locally, CI's lint lane must be green too — same config, same
# versions, no drift.
#
# Install (ONE command — pre-commit stage only as of R5-L4):
#
#   pip install pre-commit
#   pre-commit install                   # reads default_install_hook_types below
#
# Run all (debug or one-shot full sweep):
#
#   pre-commit run --all-files
#
# Single-stage design (pre-commit only):
#
#   pre-commit stage (< 5s target): formatting, lint, type check, security
#     lint, secret detection, fast contract tests. Blocks the commit itself.
#
# pre-push (~60s scaffold smoke) was REMOVED in R5-L4 (May 2026) because
# it duplicated `.github/workflows/pr-smoke-lane.yml` AND triggered
# `--no-verify` normalization on contributors who pushed frequently. The
# replacement chain is:
#
#   - on demand:           `make smoke` (~60s scaffold end-to-end)
#   - on demand (full):    `make validate-templates` (lint + render + scaffold + EDA)
#   - per PR (authoritative gate): `pr-smoke-lane.yml`
#
# Drift between local and CI means green local → red CI, which is the
# slowest and most expensive feedback loop. Avoid by version-pinning
# and by mirroring the order CI runs them in `validate-templates.yml`.
# This file is the single source of truth (CI re-uses it via
# `pre-commit run --all-files` since 2026-04-28).
#
# Toolchain: ruff (lint+format) + mypy (types) + bandit (SAST) + gitleaks
# (secrets). black/isort/flake8 were replaced by ruff in ADR-044.
#
# For the per-service hook config, see `templates/service/.pre-commit-config.yaml`.

# Single-stage install — pre-push stage was retired in R5-L4 (May 2026);
# `make smoke` + CI pr-smoke-lane.yml replace it.
#
# 2026-09-04: eight validate-templates.yml gates had no local hook at all
# (doc-coherence, cicd-template-drift, vendored-runtime-drift,
# common-utils-drift, dashboard-inventory, baselines-expiry,
# test-clock-isolation, agentic-adapter-sync). That gap — not the missing
# pre-push stage — is what let three breakages reach the remote in one
# afternoon. They are added below as pre-commit hooks rather than by
# reviving pre-push: all thirteen gates together run in 0.9 s, well inside
# the < 5 s pre-commit budget this file targets, so R5-L4's reasoning
# (a 60 s hook trains `--no-verify`) does not apply to them.
#
# `make verify` runs the same set in one command, for the sweep-before-PR
# case where you want every gate regardless of which files you touched.
default_install_hook_types: [pre-commit]

# fail_fast: false is the DEFAULT (shown explicit for intent) — we
# want contributors to see EVERY violation in one run, not stop at
# the first. Fewer commit → fix → commit → fix → commit cycles.
fail_fast: false

repos:
  # ── Ruff: lint + format (ADR-044) ────────────────────────────────────────
  # Replaces black + isort + flake8. One tool, one config block in
  # pyproject.toml, one exclude list. The three it replaced each carried
  # their own copy of the same 8-line exclude regex, duplicated across two
  # pre-commit configs -- six places to keep in sync.
  #
  # Speed was NOT the motivation: the previous suite already ran
  # `--all-files` in 2.62 s, inside this file's own < 5 s target.
  #
  # Rule scope is E,W,F,I -- exact parity with what black+isort+flake8
  # enforced. UP/B/S are deferred (ADR-044 §"Deferred rulesets").
  #
  # Ruff does NOT replace mypy (no type checking) and only partially
  # overlaps bandit; both are retained below.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        name: ruff check (lint — replaces flake8 + isort)
        args: ["--fix"]
      - id: ruff-format
        name: ruff format (replaces black)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.md$
      - id: end-of-file-fixer
        exclude: ^.*\.md$
      - id: check-yaml
        args: ["--unsafe"]
        # The Copier render root (templates/service/**) holds Jinja templates,
        # not standalone YAML — `{@ … @}` tokens are not valid YAML until
        # rendered. Their post-render validity is enforced by
        # validate-templates.yml (kustomize build + kubeconform on the
        # rendered overlays). yaml-linting the un-rendered templates is a
        # category error, so exclude the render root here.
        exclude: ^templates/service/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # mypy + bandit scope: REAL Python only.
  # `templates/service/src/{@ service_slug @}/` is template territory — the
  # `{@ service_slug @}` segment is a Jinja token that Copier
  # substitutes at scaffold time. Running static analysis on the
  # un-substituted templates explodes (mypy: "{@ service_slug @} is not a
  # valid Python package name"). The scaffolded SERVICE gets its
  # OWN per-service hook config (templates/service/.pre-commit-config.yaml).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args:
          - "--python-version=3.11"
          - "--ignore-missing-imports"
          - "--no-strict-optional"
        files: ^(templates/service/common_utils/|examples/|scripts/)
        exclude: >
          (?x)(
            ^\.venv/|
            ^.*\/tests\/|
            ^.*\/__pycache__\/|
            ^scripts/test_scaffold\.sh$
          )
        additional_dependencies:
          - "pydantic>=2.0"
          - "types-PyYAML"
          - "types-requests"

  # Security lint — bandit catches obvious patterns (eval, hardcoded
  # tmp paths, shell=True, weak crypto). `-ll -i` = LOW severity LOW
  # confidence threshold ignored, so we get medium+ only — enough
  # signal without overwhelming.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-ll", "-i"]
        files: ^(templates/service/common_utils/|examples/|scripts/)
        exclude: ^.*\/tests\/

  # Secret detection with gitleaks (D-17, D-18 invariants)
  #
  # ⚠️ VERSION INVARIANT — this pin must not drift below the version CI
  # resolves. CI runs `gitleaks/gitleaks-action@v3`, which ships 8.2x/8.3x.
  # While this hook sat at v8.21.2 the two disagreed on the CONFIG FORMAT:
  # gitleaks < 8.25 silently ignores the plural `[[allowlists]]` tables that
  # `.gitleaks.toml` uses (see CHANGELOG "L-2"). A local scan and a CI scan
  # of the same tree therefore applied different allowlists — the slowest
  # possible failure mode, because the disagreement is silent in both
  # directions and the local run is the one contributors trust.
  # Bump this and re-verify against CI; do not let it fall behind again.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret detection)
        description: Detect hardcoded secrets in template code
        args: ["--config=.gitleaks.toml"]
        pass_filenames: false

  # Project's OWN gates — run them locally so contributors don't
  # wait for CI to discover an agentic-config drift. These are
  # cheap (< 2s each) and they're already required by CI; running
  # locally is pure win.
  - repo: local
    hooks:
      - id: validate-agentic
        name: validate agentic system (rules/skills/workflows/AGENTS.md)
        description: |
          Runs scripts/validate_agentic.py --strict to catch drift
          between AGENTS.md and the agent runtime config (rules,
          skills, workflows). Same script CI runs.
        entry: python3 scripts/validate_agentic.py --strict
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|agentic/|\.devin/|\.cursor/|\.claude/|\.codex/|scripts/validate_agentic\.py)
      - id: gitleaks-pin-drift
        name: gitleaks version pin (3 sites must agree)
        description: |
          The gitleaks version is declared in both pre-commit configs and
          in the CI workflow. Below 8.25 gitleaks ignores the plural
          [[allowlists]] tables in .gitleaks.toml, so a drift makes local
          and CI scan the same tree under different rules with no signal
          from either side. Fires only when one of the three files changes.
        entry: python3 scripts/check_gitleaks_pin.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|templates/service/\.pre-commit-config\.yaml|\.github/workflows/validate-templates\.yml|scripts/check_gitleaks_pin\.py)$
      - id: adopter-scaffold-ref
        name: adopter scaffold command pins the current release
        description: |
          Copier resolves a git source to the highest-sorting tag when no
          --vcs-ref is given. This repo carries frozen v1.x audit
          snapshots alongside the active v0.x line, and v1.12.0 sorts
          above every v0.x tag — so an unpinned command silently
          scaffolds a stale snapshot. Fires on VERSION or adopter-doc
          changes.
        entry: python3 scripts/check_adopter_scaffold_ref.py
        language: system
        pass_filenames: false
        files: ^(VERSION|README\.md|QUICK_START\.md|docs/TUTORIAL\.md|docs/PROGRESSION\.md|scripts/check_adopter_scaffold_ref\.py)$
      - id: doc-coherence
        name: documentation coherence (rule 16, ADR-031)
        description: |
          C1-C7: VERSION vs CHANGELOG, llms.txt version, anti-pattern
          counts, agentic surface counts, ADR traceability, release-note
          existence, English-only + private-repo guard.
        entry: python3 scripts/check_doc_coherence.py
        language: system
        pass_filenames: false
        files: ^(VERSION|CHANGELOG\.md|llms\.txt|AGENTS\.md|README\.md|CLAUDE\.md|docs/decisions/|releases/|agentic/|scripts/check_doc_coherence\.py)
      - id: cicd-template-drift
        name: template action versions match runtime
        description: |
          Dependabot only scans .github/workflows/, so action references
          under templates/ age silently and ship to every scaffolded
          service. See docs/governance/cicd-templates-drift.md.
        entry: python3 scripts/check_cicd_template_drift.py
        language: system
        pass_filenames: false
        files: \.ya?ml$|^scripts/check_cicd_template_drift\.py$
      - id: vendored-runtime-drift
        name: vendored copies match their canonical originals
        description: |
          Files vendored byte-identical into templates/service/ (AGENTS.md,
          the agentic surface, several scripts and runbooks) must not
          diverge. Editing one side only is anti-pattern Q-06.
        entry: python3 scripts/check_vendored_runtime_drift.py
        language: system
        pass_filenames: false
        files: ^(scripts/|docs/runbooks/|agentic/|templates/service/|templates/config/|AGENTS\.md|AGENT_CONTEXT\.md)
      - id: common-utils-drift
        name: common_utils distribution contract (ADR-025)
        entry: python3 scripts/check_common_utils_drift.py
        language: system
        pass_filenames: false
        files: common_utils/
      - id: dashboard-inventory
        name: Grafana dashboard inventory is complete
        entry: python3 scripts/check_dashboard_inventory.py
        language: system
        pass_filenames: false
        files: ^(templates/service/monitoring/|docs/observability/|scripts/check_dashboard_inventory\.py)
      - id: baselines-expiry
        name: security baseline entries are dated and in-date
        entry: python3 scripts/check_baselines_expiry.py
        language: system
        pass_filenames: false
        files: ^(\.security-baselines/|scripts/check_baselines_expiry\.py)
      - id: dependency-pin-coherence
        name: requirements files sharing an environment agree on pins
        description: |
          templates/service/requirements.txt and eda/requirements.txt are
          installed into ONE environment by docs/TUTORIAL.md, and disagreed on
          scikit-learn (~=1.5.0 vs ~=1.9) and pandera (~=0.23.0 vs ~=0.33).
          pip does not object — the second install silently upgrades the first
          — so the adopter trained on 1.9 and served from an image built with
          1.5.2. Dependabot merged the bump on one lane and it was closed on
          the other; nothing compared the two files.
        entry: python3 scripts/check_dependency_pin_coherence.py
        language: system
        pass_filenames: false
        files: requirements.*\.txt$|^scripts/check_dependency_pin_coherence\.py$
      - id: dependency-partition
        name: the served image imports nothing training-only
        description: |
          requirements.txt is what the Dockerfile installs, and it carried
          mlflow, optuna, pytest, locust and httpx — 20 of the service's 24
          fixable CRITICAL/HIGH advisories, all 7 CRITICAL among them, in
          packages no code in the image imports. One unguarded `import mlflow`
          on a path the CronJobs reach puts it all back (ADR-049).
        entry: python3 scripts/check_dependency_partition.py
        language: system
        pass_filenames: false
        files: ^templates/service/(src/|app/|common_utils/|Dockerfile|requirements)|^scripts/check_dependency_partition\.py$
      - id: test-clock-isolation
        name: tests do not depend on the wall clock
        entry: python3 scripts/check_test_clock_isolation.py
        language: system
        pass_filenames: false
        files: (^|/)tests?/.*\.py$|^scripts/check_test_clock_isolation\.py$
      - id: agentic-adapter-sync
        name: generated adapter surfaces are in sync
        description: |
          .devin/, .cursor/, .claude/ and .codex/ are generated from
          agentic/ by sync_agentic_adapters.py. Editing agentic/ without
          re-running the sync ships a stale adapter surface.
        entry: python3 scripts/sync_agentic_adapters.py --check
        language: system
        pass_filenames: false
        files: ^(agentic/|\.devin/|\.cursor/|\.claude/|\.codex/|templates/config/agentic_manifest\.yaml)
      - id: doc-path-refs
        name: documentation path references resolve
        description: |
          A repo path named in prose is a checkable claim. The Copier
          migration (ADR-030) relocated the scaffolder payload under
          templates/service/ and updated every reference that executes;
          30 documents kept pointing at directories that no longer
          existed, and the dead path later reached the audit tooling
          itself. Catch it at commit time, not on the next migration.
        entry: python3 scripts/check_doc_path_refs.py
        language: system
        pass_filenames: false
        files: \.(md|txt|py|ya?ml|sh)$|(^|/)Makefile$|^\.doc-path-baseline\.yml$
      - id: control-claims
        name: '"Enforced by" claims are traceable'
        description: |
          Each D-NN row in AGENTS.md names the test or script that enforces
          it. The named file must exist AND mention the D-NN, so the link is
          bidirectional and refactoring one side fails loudly.
        entry: python3 scripts/check_control_claims.py
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|scripts/|templates/service/tests/|templates/service/scripts/)
      - id: adr-index
        name: ADR index is current
        description: |
          docs/decisions/README.md is generated from the ADR files and
          cited by docs/COMPLIANCE_MAPPING.md as EU AI Act Art. 11
          evidence. Adding an ADR without regenerating leaves a
          compliance claim an auditor can falsify.
        entry: python3 scripts/generate_adr_index.py --check
        language: system
        pass_filenames: false
        files: ^(docs/decisions/|scripts/generate_adr_index\.py)
      - id: service-adr-references
        name: generated service ADR references are resolvable
        description: |
          The render root cites 39 template ADRs and vendors 6. Without a
          resolution doc the other 33 are unresolvable for the adopter and
          collide with their own ADR numbering. Renaming to
          template-ADR-NNN is blocked by the byte-identical vendored drift
          gate, so the contract is a resolution layer instead.
        entry: python3 scripts/check_service_adr_references.py
        language: system
        pass_filenames: false
        files: ^(templates/service/docs/decisions/|scripts/check_service_adr_references\.py)
      - id: markdownlint-parity
        name: template and service markdownlint rules agree
        description: |
          Two configs exist — this repo's and the one shipped to every
          generated service — because the two trees are not the same
          shape, so the globs differ. The RULE block must not. A template
          that lints itself to a stricter bar than it ships makes its own
          standard untrue. Also checks that every path-shaped exclusion
          resolves: the repo config carried
          `!templates/service/eda/notebooks/**` for a directory that never
          existed, and nothing was looking.
        entry: python3 scripts/check_markdownlint_parity.py
        language: system
        pass_filenames: false
        files: markdownlint-cli2\.jsonc$|^scripts/check_markdownlint_parity\.py$
      - id: payload-test-scope
        name: payload tests are about the generated service
        description: |
          templates/service/tests/ is the Copier payload: an adopter gets
          every file in it. Tests that bind their only root above the
          service root are about THIS repository, and in a service they
          resolve to whatever sits two directories above the adopter's
          checkout. Measured before this gate: 147 of 764 tests failed on
          a freshly scaffolded service. Repository tests belong in
          templates/tests/governance/, where the depth is unchanged.
        entry: python3 scripts/check_payload_test_scope.py
        language: system
        pass_filenames: false
        files: ^(templates/service/tests/|scripts/check_payload_test_scope\.py)
      - id: template-render-safety
        name: render root parses as Copier templates
        description: |
          copier.yml sets `_templates_suffix: ""`, so every file under
          templates/service/ is a Jinja template. A file that merely
          contains Jinja's delimiters aborts `copier copy` entirely and
          the adopter gets nothing. Bash array-length syntax opens
          Copier's comment token, and prose about `{@ @}` opens an
          expression — both have broken the scaffolder here. This is a
          parse, not a render; scripts/test_scaffold.sh stays the
          authority on behaviour.
        entry: python3 scripts/check_template_render_safety.py
        language: system
        pass_filenames: false
        files: ^(templates/service/|copier\.yml|scripts/check_template_render_safety\.py)
      - id: ci-autofix-policy-contract
        name: CI autofix policy contract (ADR-019)
        description: |
          The two governance YAMLs in templates/config/ have a
          contract test (10 invariants). Run it locally on every
          commit that touches them so policy drift never reaches CI.
        # --noconftest: the sibling conftest.py imports numpy (needed
        # for the service test suite but not for this contract test).
        # --rootdir: avoids pytest walking up to the repo pyproject.toml
        # which applies coverage plugins this hook doesn't need.
        # -s disables pytest capture for portability across local shells and
        # pre-commit temp dirs; this contract test does not need captured IO.
        entry: python3 -m pytest templates/service/tests/test_ci_autofix_policy_contract.py -q -s -o addopts="" --noconftest --rootdir=.
        language: system
        pass_filenames: false
        files: ^(templates/config/(ci_autofix_policy|model_routing_policy)\.yaml|templates/service/tests/test_ci_autofix_policy_contract\.py)$

  # NOTE: scaffold smoke test was previously a pre-push hook here.
  # Removed per R5-L4 (audit-r4 / R5 mini-audit, May 2026). Rationale:
  #   - the same scaffold + 6 overlay renders + kubeconform + binary
  #     audit runs on every PR via .github/workflows/pr-smoke-lane.yml
  #   - >60s on every push triggers `--no-verify` normalization, which
  #     silently kills the invariant the hook was protecting
  #   - industry baseline: pre-commit < 5 s, pre-push < 30 s, CI per-PR
  #     3–10 min (Software Engineering at Google §4.2)
  # On-demand local runs:
  #   make smoke              # alias of: bash scripts/test_scaffold.sh (Copier render)
  #   make validate-templates # full local validation chain
  # See docs/audit/ACTION_PLAN_R5.md §R5-L4 for the full decision record.
