# DVC Pipeline — {@ service_name @}
# Data versioning and pipeline reproducibility.
#
# Setup:
#   dvc init
#   dvc remote add -d storage gs://your-bucket/dvc/{@ service_slug @}    # GCP
#   dvc remote add -d storage s3://your-bucket/dvc/{@ service_slug @}    # AWS
#
# Usage:
#   dvc repro              # Run full pipeline
#   dvc push               # Push data/models to remote
#   dvc pull               # Pull data/models from remote
#   dvc dag                # View pipeline DAG
#
# Why two stages and not four
# ---------------------------
# This file used to declare `validate`, `featurize`, `train` and `evaluate`.
# Three of the four could not run:
#
#   - `validate` invoked `training/validate_data.py`  — no such file, ever.
#   - `featurize` invoked `training/features.py`      — real file, but it
#     defines `FeatureEngineer` and has no CLI, so the stage would exit 0
#     having produced nothing and DVC would fail on the missing output.
#   - `train` invoked `training/train.py` as a script — `ImportError:
#     attempted relative import with no known parent package`.
#
# The two missing stages were never missing capability: `train.py` validates
# with `ServiceInputSchema` (Pandera) and applies `FeatureEngineer` itself, in
# one process. Splitting them out would mean writing two entrypoints that only
# exist to satisfy a DAG shape.
#
# The commands below go through `src/{@ service_slug @}/cli.py`, which already
# carries `train`, `evaluate` and `predict` subcommands. It was itself
# unreachable until recently — a package shadowed the module it imported — so
# this pipeline was written against a CLI that could not be called. Both are
# fixed, and `tests/test_dvc_pipeline_is_runnable.py` now asserts every stage
# command resolves to something that exists and can be invoked the way the
# stage invokes it.
#
# TODO: Update paths and parameters for your actual pipeline.

stages:
  train:
    # Validation (Pandera) and feature engineering happen inside this stage —
    # see the header. Module form, never `python src/.../train.py`.
    cmd: >-
      python -m src.{@ service_slug @}.cli train
      --config configs/config.yaml
      --input data/raw/dataset.csv
      --model-dir models
      --metrics-output reports/metrics.json
    deps:
      - data/raw/dataset.csv
      - configs/config.yaml
      - configs/quality_gates.yaml
      - src/{@ service_slug @}/schemas.py
      - src/{@ service_slug @}/training/features.py
      - src/{@ service_slug @}/training/model.py
      - src/{@ service_slug @}/training/train.py
    outs:
      - models/model.joblib:
          cache: true
      - models/model_metadata.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: >-
      python -m src.{@ service_slug @}.cli evaluate
      --config configs/config.yaml
      --input data/raw/dataset.csv
      --model models/model.joblib
      --output reports/evaluation.json
    deps:
      - models/model.joblib
      - data/raw/dataset.csv
      - configs/config.yaml
      - src/{@ service_slug @}/evaluation/metrics.py
    metrics:
      - reports/evaluation.json:
          cache: false
