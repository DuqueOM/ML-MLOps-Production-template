name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (ruff, mypy, bandit, gitleaks)
        # Single source of truth for versions: .pre-commit-config.yaml.
        # Prevents version drift between CI and local pre-commit install.
        # Runs all commit-stage hooks (excludes pre-push scaffold smoke).
        run: pre-commit run --all-files --hook-stage commit

      - name: mypy (against installed dependencies)
        # mypy IS in .pre-commit-config.yaml and the step above already ran
        # it — the comment here used to say it was not, with a TODO to add
        # it, both of which had been untrue since the hook was added.
        #
        # This step is still worth its seconds, for a reason worth stating:
        # `mirrors-mypy` runs mypy in its own virtualenv with no project
        # dependencies, so it infers far less than mypy running where
        # pandas, fastapi and pydantic are actually importable. The two
        # runs check the same files and do not find the same things.
        run: |
          pip install mypy
          mypy src/ app/ --ignore-missing-imports

      # ADR-015 PR-B1 — quality_gates.yaml as an executable contract.
      # Runs before pytest so a malformed quality_gates.yaml fails in
      # ~2s with a clear pointer instead of after the 4-minute test
      # job in a confusing "config dataclass missing required field"
      # traceback. Pure stdlib + pyyaml + jsonschema, so we install
      # only the lightweight deps here (the full requirements.txt
      # install happens in the `test` job).
      - name: Validate quality_gates.yaml (PR-B1)
        run: |
          pip install --quiet pyyaml jsonschema
          python scripts/validate_quality_gates.py --require-at-least-one

  test:
    name: Test — ${{ matrix.service }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        service:
          # Single-service repo: scaffolder substitutes the display name.
          # The generated service itself lives at repo root.
          # Multi-service adopters may convert this to service-root objects.
          - "{@ service_name @}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements-dev.txt pulls requirements.txt and adds the test
        # tooling. It deliberately does NOT pull requirements-train.txt:
        # if a test needs mlflow or optuna it belongs in a training lane,
        # not here (ADR-049).
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p results
          pytest tests/ \
            --cov=src --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --junitxml=results/junit.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.service }}-py${{ matrix.python-version }}
          path: results/

  contract-check:
    name: API contract — snapshot ↔ version pair-change (D-28)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - "{@ service_name @}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need the PR base + HEAD to diff against.
          fetch-depth: 0

      - name: Detect snapshot ↔ version pair-change
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          SVC="${{ matrix.service }}"

          SNAPSHOT="tests/contract/openapi.snapshot.json"
          MAIN="app/main.py"

          # Did the PR change the snapshot?
          if git diff --name-only "$BASE" "$HEAD" | grep -qx "$SNAPSHOT"; then
            echo "Snapshot changed in this PR — verifying paired version bump."

            # main.py must also have changed.
            if ! git diff --name-only "$BASE" "$HEAD" | grep -qx "$MAIN"; then
              echo "::error file=$SNAPSHOT::OpenAPI snapshot changed without a matching change to $MAIN. Bump app.version per rule 14 §semver."
              exit 1
            fi

            # And the version literal must be different between base and head.
            BASE_V=$(git show "${BASE}:${MAIN}" 2>/dev/null | grep -E "^\s*version\s*=" | head -1 || true)
            HEAD_V=$(git show "${HEAD}:${MAIN}" 2>/dev/null | grep -E "^\s*version\s*=" | head -1 || true)
            if [ "$BASE_V" = "$HEAD_V" ] && [ -n "$BASE_V" ]; then
              echo "::error file=$MAIN::Snapshot changed but app.version line is identical to base. Bump it (rule 14 §semver)."
              exit 1
            fi

            echo "✓ Pair-change verified: snapshot AND app.version both updated."
          else
            echo "Snapshot unchanged — pair-change rule does not apply."
          fi

  security-audit:
    name: Security Audit — secrets, SAST, IaC
    runs-on: ubuntu-latest
    needs: [test]
    # Runs on PRs AND main pushes — the previous `if: github.ref ==
    # 'refs/heads/main'` allowed insecure changes to merge unchecked.
    # Build/sign/promote stages remain main-only via their own guards.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Gitleaks — scan for secrets (D-17)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hardcoded credential patterns (D-17)
        run: |
          set -euo pipefail
          if grep -rEI "AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}" \
               --include="*.py" --include="*.yaml" --include="*.yml" --include="*.tf" .; then
            echo "::error::Hardcoded credential pattern detected (D-17 violation)"
            exit 1
          fi
          if grep -rE "os\.environ\[.(API_KEY|SECRET|TOKEN|PASSWORD)" --include="*.py" .; then
            echo "::error::Direct os.environ access to secret-like names — use common_utils.secrets.get_secret instead (D-17)"
            exit 1
          fi

      - name: IRSA/Workload Identity enforcement (D-18)
        run: |
          # In staging/prod K8s manifests, ServiceAccounts must have IRSA or WI annotation
          # Real overlay dirs are `<cloud>-{dev,staging,prod}` (NOT
          # `*-production`); the previous glob matched nothing so prod
          # ServiceAccounts were never validated for IRSA / WI.
          for manifest in k8s/overlays/*-staging/*.yaml k8s/overlays/*-prod/*.yaml; do
            [ -f "$manifest" ] || continue
            if grep -qE "kind:\s*ServiceAccount" "$manifest"; then
              if ! grep -qE "(eks.amazonaws.com/role-arn|iam.gke.io/gcp-service-account)" "$manifest"; then
                echo "::error file=$manifest::ServiceAccount missing IRSA/WI annotation (D-18)"
                exit 1
              fi
            fi
          done

  build:
    name: Build, Sign & Attest — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write    # required for cosign keyless (OIDC)
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - "{@ service_name @}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        id: build
        run: |
          IMAGE="{@ service_kebab @}-predictor:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: "Trivy vulnerability scan (blocker: HIGH/CRITICAL)"
        # Pinned to immutable tag (D-19, ADR-014 section 1.1). Dependabot updates
        # via .github/dependabot.yml. Phase 5 will harden to commit-SHA.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOM (CycloneDX JSON) — SLSA L2 component (D-19)
        run: |
          syft "${{ steps.build.outputs.image }}" -o cyclonedx-json > sbom.cyclonedx.json
          syft "${{ steps.build.outputs.image }}" -o spdx-json > sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom.*.json
          retention-days: 90

      # Push + sign + attest live in deploy-{gcp,aws}.yml (D-19, ADR-014 §3.2).
      # Why not here:
      #   - cosign sign requires an image+digest in a registry → push first
      #   - push requires cloud creds (WIF for GCP, IRSA for AWS) which are
      #     scoped to the deploy workflows by environment Protection Rules
      # Kyverno's trust regexp in templates/k8s/policies/kyverno-image-verification.yaml
      # accepts signatures from ci.yml, deploy-gcp.yml, or deploy-aws.yml so
      # the trust chain stays honest about where signing actually happens.
      - name: Install Cosign (used by deploy workflows; verify-only here)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin Cosign binary to v2.x explicitly. cosign-installer v4 defaults
          # to Cosign v3 which is a breaking change (CLI flag renames, mandatory
          # tlog inclusion proofs). We defer the v2→v3 migration to a dedicated
          # ADR; here we only adopt the installer security patches.
          cosign-release: v2.4.0

      - name: Emit build provenance summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build Summary — ${{ matrix.service }}

          - **Commit**: \`${{ github.sha }}\`
          - **Image**: \`${{ steps.build.outputs.image }}\`
          - **SBOM**: CycloneDX + SPDX attached as artifact
          - **Signatures**: $(cosign verify --certificate-identity-regexp ".*" "${{ steps.build.outputs.image }}" 2>/dev/null && echo "✓ signed" || echo "⚠ dev build (unsigned)")
          EOF
