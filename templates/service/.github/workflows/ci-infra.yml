name: CI — Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/**"
      - "k8s/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "k8s/**"

jobs:
  terraform-validate:
    name: Terraform — ${{ matrix.cloud }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [gcp, aws, cloudflare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra/terraform/${{ matrix.cloud }}

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: infra/terraform/${{ matrix.cloud }}

      - name: Terraform validate
        run: terraform validate
        working-directory: infra/terraform/${{ matrix.cloud }}

      # ADR-046: tfsec is archived upstream; Trivy config is its successor.
      # Same action the template repo uses for its own IaC gate.
      - name: Trivy config (Terraform IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/${{ matrix.cloud }}
          # Every severity, same as the upstream template.
          #
          # This ran at CRITICAL,HIGH until 2026-09-07, on the argument that a
          # service had nowhere to record an accepted finding, so a stricter
          # gate would just get deleted. True — and a fixable gap rather than
          # a reason, so it was fixed: `.security-baselines/` and
          # `scripts/check_baselines_expiry.py` now ship with the service.
          #
          # Worth knowing before you lower it: upstream, 10 of the 13 findings
          # that sat below a severity threshold turned out to be real defects,
          # including a GKE node pool running as the default Compute Engine
          # service account. "Below the threshold" predicted nothing.
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "1"
          trivyignores: .security-baselines/trivy-config.trivyignore
          format: table

      # The baseline is only a control if its entries expire. Without this the
      # ignore file is an ordinary suppression list that grows and never
      # shrinks.
      - name: Security baseline expiry
        run: python3 scripts/check_baselines_expiry.py

      - name: Checkov
        # Pinned to immutable tag (D-19, ADR-014 §1.1). Dependabot updates
        # via .github/dependabot.yml. Phase 5 will harden to commit-SHA.
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: infra/terraform/${{ matrix.cloud }}
          quiet: true
          framework: terraform

  k8s-validate:
    name: K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubeconform (PR-R2-5)
        # Replaces the deprecated kubeval install that used
        # /releases/latest/download/. Pinned version, direct release
        # tarball, no `curl | bash`. kubeval was archived upstream;
        # kubeconform is the maintained successor and is also used
        # by the top-level validate-templates.yml.
        run: |
          set -euo pipefail
          KCVER=v0.6.7
          curl -sSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KCVER}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -v

      - name: Install kustomize
        # Pinned, same version the template repo validates with, so the two
        # runs cannot disagree. Previously this job used `kubectl kustomize`,
        # whose embedded kustomize is a different (older) version than the one
        # the template validates against — a silent source of "passes there,
        # fails here".
        run: |
          set -euo pipefail
          KVER=v5.4.3
          curl -sSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KVER}/kustomize_${KVER}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      - name: Validate manifests (base + every overlay)
        # Blocking. This replaced three steps: a base check that globbed
        # `k8s/base/*.yaml`, and two overlay loops over `gcp-*` and `aws-*`
        # that were `continue-on-error: true` and between them skipped the
        # `batch-only` overlay entirely.
        #
        # The shared script fails when a discovery step finds nothing, which
        # the old loops could not: `for o in k8s/overlays/gcp-*` over an empty
        # match validated zero overlays and reported the same green as one
        # that validated all of them.
        run: bash scripts/validate_k8s_manifests.sh k8s
